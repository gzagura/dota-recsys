# Сайт nginx. Кладётся в /etc/nginx/sites-available/dota-draft
# и линкуется в sites-enabled. ДОМЕН замени на свой.
#
# Блок с TLS дописывает certbot сам (`certbot --nginx`), поэтому здесь
# только HTTP: сначала поднимаем на 80, получаем сертификат, и уже после
# этого certbot добавит 443 и редирект.

server {
    listen 80;
    listen [::]:80;
    server_name ДОМЕН;

    # Сервер отвечает за 7 мс, ждать минуту незачем: если бэкенд молчит,
    # он не думает, а лежит.
    proxy_read_timeout 30s;
    proxy_connect_timeout 5s;

    # Профиль тянется из OpenDota и может занять несколько секунд, поэтому
    # у этой ручки таймаут отдельный и больше общего.
    location /api/profile {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 60s;
        include proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include proxy_params;
    }

    # Пароль от Basic летит в заголовке каждого запроса. Пока сайт на
    # голом HTTP, он летит открытым текстом — не открывай доступ друзьям
    # до выпуска сертификата.
}
